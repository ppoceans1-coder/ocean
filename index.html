<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>嘻嘻嘻斯基 - 全球B2B采购平台</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",Arial,sans-serif;
}

body{
background:#f5f6f8;
color:#333;
}


/* 顶部公告 */

.notice{
height:40px;
background:#fff3e6;
color:#ff6600;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
}



/* 导航 */

header{

height:75px;
background:#fff;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 8%;

box-shadow:0 2px 15px rgba(0,0,0,.08);

position:sticky;
top:0;
z-index:10;

}


.logo{

font-size:30px;
font-weight:bold;
color:#ff6600;

}


.logo span{

font-size:14px;
color:#888;

margin-left:8px;

}



nav a{

margin:0 15px;
text-decoration:none;
color:#333;

}


nav a:hover{

color:#ff6600;

}


.btn{

background:#ff6600;
color:white;

border:none;

padding:12px 25px;

border-radius:5px;

cursor:pointer;

}




/* 首页大图 */


.hero{


height:600px;


background:

linear-gradient(
90deg,
rgba(0,0,0,.65),
rgba(0,0,0,.2)
),

url("https://picsum.photos/1600/900");


background-size:cover;

background-position:center;


display:flex;

align-items:center;

padding-left:8%;


color:white;


}



.hero-content{

max-width:750px;

animation:up .8s;

}



.hero h1{

font-size:58px;

line-height:1.3;

}



.hero p{

font-size:22px;

margin:25px 0;

}



.search{


display:flex;

width:650px;

height:60px;

}



.search input{


flex:1;

border:none;

padding:0 20px;

font-size:16px;

}


.search button{

width:120px;

border:none;

background:#ff6600;

color:white;

font-size:18px;

}





.data{

display:flex;

gap:50px;

margin-top:40px;

}



.data strong{

display:block;

font-size:35px;

color:#ffb36b;

}






/* 内容 */

.section{

padding:70px 8%;

}



.title{

text-align:center;

font-size:36px;

margin-bottom:40px;

}





/* 分类 */


.categories{


display:grid;

grid-template-columns:repeat(6,1fr);

gap:20px;

}



.category{

background:white;

padding:30px 10px;

text-align:center;

border-radius:12px;

transition:.3s;

}



.category:hover{

transform:translateY(-8px);

box-shadow:0 10px 25px #ddd;

}



.category h3{

margin:15px 0;

}






/* 产品 */


.product-area{

background:#f0f2f5;

}



.products{


display:grid;

grid-template-columns:repeat(3,1fr);

gap:30px;


}



.product{


background:white;

padding:20px;

border-radius:12px;


}


.product img{


width:100%;

height:230px;

object-fit:cover;

border-radius:10px;


}



.product h3{

font-size:22px;

margin:15px 0;

}



.price{

color:#ff6600;

font-size:25px;

font-weight:bold;

margin:15px 0;

}



.product button{


background:#ff6600;

color:white;

border:none;

padding:12px 25px;

border-radius:5px;


}




/* 供应商 */


.supplier{


background:white;

text-align:center;

padding:70px;


}


.supplier h2{

font-size:35px;

margin-bottom:20px;

}




/* 页脚 */

footer{

background:#222;

color:white;

text-align:center;

padding:30px;

}



/* 动画 */

@keyframes up{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:none;

}

}





/* 手机 */

@media(max-width:900px){


nav{

display:none;

}


.hero{

padding:30px;

}


.hero h1{

font-size:35px;

}


.search{

width:100%;

}


.categories{

grid-template-columns:repeat(2,1fr);

}



.products{

grid-template-columns:1fr;

}



.data{

gap:15px;

}


}



</style>


</head>



<body>


<div class="notice">
