<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>嘻嘻嘻斯基</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",Arial;
}

body{
    background:#f5f6f8;
    color:#333;
}


/* 顶部导航 */

header{

height:70px;
background:white;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 8%;

box-shadow:0 2px 8px #ddd;

}


.logo{

font-size:28px;
font-weight:bold;
color:#ff6600;

}


nav a{

margin:0 15px;
text-decoration:none;
color:#333;

}


.top-btn{

background:#ff6600;
color:white;

padding:12px 25px;

border-radius:5px;

}



/* 首页banner */

.banner{


height:520px;


background:

linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),

url("https://picsum.photos/1600/700");


background-size:cover;

display:flex;

align-items:center;

padding-left:10%;

color:white;


}



.banner h1{

font-size:52px;

}


.banner p{

font-size:22px;

margin:25px 0;

}



.search{


display:flex;

}



.search input{


width:500px;

padding:18px;

border:none;

font-size:16px;

}



.search button{

background:#ff6600;

border:none;

color:white;

padding:0 35px;

font-size:18px;

}





/* 分类 */


.container{

padding:50px 8%;

}



.title{

text-align:center;

font-size:32px;

margin-bottom:40px;

}



.categories{


display:grid;

grid-template-columns:repeat(6,1fr);

gap:20px;


}


.category{


background:white;

padding:30px 10px;

text-align:center;

border-radius:10px;

cursor:pointer;

transition:.3s;


}


.category:hover{

transform:translateY(-5px);

box-shadow:0 5px 15px #ddd;

}





/* 产品 */

.products{


display:grid;

grid-template-columns:repeat(3,1fr);

gap:30px;


}



.product{


background:white;

padding:20px;

border-radius:10px;


}



.product img{

width:100%;

height:220px;

object-fit:cover;

border-radius:8px;


}



.product h3{

margin:15px 0;

}


.price{

color:#ff6600;

font-size:20px;

font-weight:bold;

}


.product button{


margin-top:15px;

background:#ff6600;

border:none;

color:white;

padding:12px 25px;

border-radius:5px;


}





/* 供应商 */


.supplier{


background:white;

padding:60px;

text-align:center;


}



.supplier button{


margin-top:25px;

background:#ff6600;

color:white;

border:none;

padding:15px 40px;

border-radius:5px;


}



/* 页脚 */


footer{


background:#222;

color:white;

text-align:center;

padding:30px;


}




/* 手机适配 */

@media(max-width:768px){


nav{

display:none;

}


.banner h1{

font-size:32px;

}


.search input{

width:220px;

}



.categories{

grid-template-columns:repeat(2,1fr);

}



.products{

grid-template-columns:1fr;

}


}



</style>


</head>



<body>


<header>


<div class="logo">

嘻嘻嘻斯基

</div>


<nav>

<a href="#">首页</a>

<a href="#">产品</a>

<a href="#">供应商</a>

<a href="#">采购中心</a>

<a href="#">联系我们</a>


</nav>


<div class="top-btn">

发布询盘

<section class="banner">

</h1>


<p>

专业B2B采购平台，帮助企业寻找可靠供应商

</p>



<div class="search">


<input placeholder="搜索产品，例如：电子产品、食品、服装">


<button>

搜索

</button>


</div>


</div>


</section>





<section class="container">


<h2 class="title">

</h2>


<div class="categories">


<div class="category">
电子产品
</div>


<div class="category">

</div>


<div class="category">

</div>


<div class="category">
家居用品
</div>


<div class="category">

</div>


<div class="category">
美容用品
</div>



</div>


</section>






<section class="container">


<h2 class="title">

热门商品

</h2>


<div class="products">


<div class="product">


<img src="https://picsum.photos/500/300?1">


<h3>
智能电子设备
</h3>


<p>
厂家直供 支持批量采购
</p>


<div class="price">

$9.99

</div>


<button>
立即询价
</button>


</div>





<div class="product">


<img src="https://picsum.photos/500/300?2">


<h3>
健康食品系列
</h3>


<p>
出口品质 全球配送
</p>


<div class="price">

$15.99

</div>


<button>
立即询价
</button>


</div>





<div class="product">


<img src="https://picsum.photos/500/300?3">


<h3>
智能家居产品
</h3>


<p>
支持OEM定制
</p>


<div class="price">

$25.99

</div>


<button>
立即询价
</button>


</div>


</div>


</section>






<section class="supplier">


<h2>

认证供应商服务

</h2>


<p>

严格筛选工厂，为全球买家提供稳定供应链

</p>


<button>

查看供应商

</button>


</section>





<footer>


© 2026 嘻嘻嘻斯基 Global Trade Platform


</footer>

.forEach(function(btn){

btn.onclick=function(){

alert("感谢您的咨询，我们会尽快联系您！");

}

});


</script>



</body>

</html>
